org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle 9 는 `gradle init` 으로 만든 새 프로젝트에만 기본 활성이라 기존 빌드는 직접 켜야 한다.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.code.style=official

# kotlin-stdlib 은 inmc-core 만 번들한다 (relocate 없이).
# 의존 플러그인이 각자 stdlib 을 넣으면 core 가 넘겨주는 람다의 Function1 이
# 서로 다른 클래스가 되어 런타임에 NoSuchMethodError 가 난다. 그래서 자동 추가를 끈다.
kotlin.stdlib.default.dependency=false
